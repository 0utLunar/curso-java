services:
  mysql:
    image: mysql:8.4
    container_name: jdbc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234567
      MYSQL_DATABASE: jdbc
      MYSQL_USER: developer
      MYSQL_PASSWORD: 1234567
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: